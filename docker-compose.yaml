services:
  app:                                   # Laravel application
    build: .
    ports:
      - "127.0.0.1:8000:8000"            # http://localhost:8000 (this computer only)
    environment:                         # database settings, must match the "db" service below
      DB_CONNECTION: mysql
      DB_HOST: db                        # the service name below, NOT localhost
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy       # wait until MySQL is ready

  db:                                    # MySQL database (downloaded automatically)
    image: mysql:8
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/mysql            # keeps your data between restarts

volumes:
  dbdata:
